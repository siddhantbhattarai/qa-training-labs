<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - QA Training Lab</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
        <nav class="navbar">
        <div class="nav-brand">
            <span class="logo">🧪</span>
            <a href="/" class="brand-text" style="text-decoration: none;">QA Training Lab</a>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/pages/curriculum.html" class="nav-link">Curriculum</a>
            <a href="/pages/dashboard.html" class="nav-link">Dashboard</a>
            <a href="/pages/products.html" class="nav-link">Products</a>
            <a href="/pages/cart.html" class="nav-link">Cart</a>
            <a href="/pages/orders.html" class="nav-link">Orders</a>
            <a href="/pages/bugs.html" class="nav-link">Bug Hunt</a>
            <a href="/pages/reporting.html" class="nav-link">Reporting</a>
            <a href="/api/docs" class="nav-link" target="_blank">API Docs</a>
        </div>
        <div class="nav-auth" id="navAuth"></div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Start your QA learning journey today</p>
            </div>
            
            <div id="alertContainer"></div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" class="form-input" placeholder="John Doe" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Create a password" required>
                    <p class="form-hint">At least 8 characters with uppercase, lowercase, and number</p>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm your password" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="submitBtn">
                    Create Account
                </button>
            </form>
            
            <div class="auth-footer">
                Already have an account? <a href="/pages/login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="/js/qalevel.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <script>
        if (Auth.isAuthenticated()) {
            window.location.href = '/pages/dashboard.html';
        }
        
        function showAlert(message, type = 'error') {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showAlert('Passwords do not match');
                return;
            }
            
            App.showLoading(submitBtn);
            
            const result = await Auth.register({ name, email, password });
            
            App.hideLoading(submitBtn);
            
            if (result.success) {
                window.location.href = '/pages/dashboard.html';
            } else {
                showAlert(result.error || 'Registration failed. Please try again.');
            }
        });
    </script>
</body>
</html>
