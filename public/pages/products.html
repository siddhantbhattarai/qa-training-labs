<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - QA Training Lab</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="logo">🧪</span>
            <a href="/" class="brand-text" style="text-decoration: none;">QA Training Lab</a>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/pages/dashboard.html" class="nav-link">Dashboard</a>
            <a href="/pages/products.html" class="nav-link active">Products</a>
            <a href="/pages/cart.html" class="nav-link">Cart</a>
            <a href="/pages/orders.html" class="nav-link">Orders</a>
            <a href="/pages/bugs.html" class="nav-link">Bug Hunt</a>
            <a href="/api/docs" class="nav-link" target="_blank">API Docs</a>
        </div>
        <div class="nav-auth" id="navAuth"></div>
    </nav>

    <main class="page-container">
        <div class="dashboard-header">
            <h1>Products</h1>
            <p>Browse our catalog and test the shopping experience</p>
        </div>

        <div class="card" style="margin-bottom: 1.5rem;">
            <div class="card-body" style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
                <input type="text" id="searchInput" class="form-input" placeholder="Search products..." style="flex: 1; min-width: 200px;">
                <select id="categoryFilter" class="form-input" style="width: auto;">
                    <option value="">All Categories</option>
                    <option value="electronics">Electronics</option>
                    <option value="clothing">Clothing</option>
                    <option value="books">Books</option>
                    <option value="home">Home</option>
                    <option value="sports">Sports</option>
                </select>
                <select id="sortBy" class="form-input" style="width: auto;">
                    <option value="">Sort By</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                    <option value="name_asc">Name: A-Z</option>
                    <option value="name_desc">Name: Z-A</option>
                </select>
                <button class="btn btn-primary" onclick="loadProducts()">Search</button>
            </div>
        </div>

        <div id="productsContainer" class="products-grid">
            <div class="skeleton" style="height: 300px;"></div>
            <div class="skeleton" style="height: 300px;"></div>
            <div class="skeleton" style="height: 300px;"></div>
        </div>

        <div id="pagination" style="margin-top: 2rem; display: flex; justify-content: center; gap: 0.5rem;"></div>
    </main>

    <!-- Product Details Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalProductName">Product Details</h3>
                <button class="modal-close" onclick="App.closeModal('productModal')">&times;</button>
            </div>
            <div class="modal-body" id="modalProductContent">
                Loading...
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="App.closeModal('productModal')">Close</button>
                <button class="btn btn-primary" id="modalAddToCart">Add to Cart</button>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let currentPage = 1;
        let products = [];

        async function loadProducts() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = `
                <div class="skeleton" style="height: 300px;"></div>
                <div class="skeleton" style="height: 300px;"></div>
                <div class="skeleton" style="height: 300px;"></div>
            `;

            const params = {
                page: currentPage,
                limit: 12,
                search: document.getElementById('searchInput').value,
                category: document.getElementById('categoryFilter').value,
                sort: document.getElementById('sortBy').value
            };

            Object.keys(params).forEach(key => {
                if (!params[key]) delete params[key];
            });

            const result = await API.products.list(params);

            if (result.success) {
                products = result.data.products || result.data || [];
                renderProducts(products);
                renderPagination(result.data.pagination);
            } else {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">❌</div>
                        <h3>Failed to load products</h3>
                        <p>${result.error || 'Please try again later'}</p>
                        <button class="btn btn-primary" onclick="loadProducts()">Retry</button>
                    </div>
                `;
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('productsContainer');
            
            if (!products || products.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">📦</div>
                        <h3>No products found</h3>
                        <p>Try adjusting your search or seed the database first.</p>
                        <button class="btn btn-primary" onclick="seedAndReload()">Seed Database</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">${App.getProductEmoji(product.category)}</div>
                    <div class="product-info">
                        <span class="product-category">${product.category || 'General'}</span>
                        <h3 class="product-name">${product.name}</h3>
                        <p class="product-price">${App.formatPrice(product.price)}</p>
                        <p class="product-stock">${product.stock > 0 ? `${product.stock} in stock` : 'Out of stock'}</p>
                    </div>
                    <div class="product-actions">
                        <button class="btn btn-outline btn-sm" onclick="viewProduct('${product._id}')">View Details</button>
                        <button class="btn btn-primary btn-sm" onclick="addToCart('${product._id}')" ${product.stock <= 0 ? 'disabled' : ''}>
                            Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderPagination(pagination) {
            const container = document.getElementById('pagination');
            if (!pagination || pagination.totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 1; i <= pagination.totalPages; i++) {
                html += `<button class="btn ${i === pagination.currentPage ? 'btn-primary' : 'btn-outline'} btn-sm" onclick="goToPage(${i})">${i}</button>`;
            }
            container.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            loadProducts();
        }

        async function viewProduct(id) {
            const product = products.find(p => p._id === id);
            if (!product) {
                const result = await API.products.get(id);
                if (!result.success) {
                    App.showToast('Failed to load product details', 'error');
                    return;
                }
                showProductModal(result.data);
            } else {
                showProductModal(product);
            }
        }

        function showProductModal(product) {
            document.getElementById('modalProductName').textContent = product.name;
            document.getElementById('modalProductContent').innerHTML = `
                <div style="text-align: center; font-size: 4rem; margin-bottom: 1rem;">
                    ${App.getProductEmoji(product.category)}
                </div>
                <div style="display: grid; gap: 1rem;">
                    <div>
                        <label style="color: var(--text-muted); font-size: 0.85rem;">Description</label>
                        <p>${product.description || 'No description available'}</p>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div>
                            <label style="color: var(--text-muted); font-size: 0.85rem;">Price</label>
                            <p style="font-size: 1.5rem; font-weight: 700; color: var(--secondary);">${App.formatPrice(product.price)}</p>
                        </div>
                        <div>
                            <label style="color: var(--text-muted); font-size: 0.85rem;">Stock</label>
                            <p>${product.stock} units</p>
                        </div>
                    </div>
                    <div>
                        <label style="color: var(--text-muted); font-size: 0.85rem;">Category</label>
                        <p>${product.category || 'General'}</p>
                    </div>
                    <div>
                        <label style="color: var(--text-muted); font-size: 0.85rem;">Product ID</label>
                        <p style="font-family: monospace; font-size: 0.85rem;">${product._id}</p>
                    </div>
                </div>
            `;
            document.getElementById('modalAddToCart').onclick = () => {
                addToCart(product._id);
                App.closeModal('productModal');
            };
            App.openModal('productModal');
        }

        async function addToCart(productId) {
            if (!Auth.isAuthenticated()) {
                App.showToast('Please login to add items to cart', 'warning');
                window.location.href = '/pages/login.html?redirect=/pages/products.html';
                return;
            }

            const result = await API.cart.add(productId, 1);
            if (result.success) {
                App.showToast('Added to cart!', 'success');
            } else {
                App.showToast(result.error || 'Failed to add to cart', 'error');
            }
        }

        async function seedAndReload() {
            const result = await API.seed();
            if (result.success) {
                App.showToast('Database seeded! Loading products...', 'success');
                setTimeout(loadProducts, 1000);
            } else {
                App.showToast(result.error || 'Failed to seed database', 'error');
            }
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadProducts();
        });

        document.getElementById('categoryFilter').addEventListener('change', loadProducts);
        document.getElementById('sortBy').addEventListener('change', loadProducts);

        // Initial load
        loadProducts();
    </script>
</body>
</html>
